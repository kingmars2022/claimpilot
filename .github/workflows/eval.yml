name: Accuracy evaluation

# Runs the real models (Ollama on the runner's CPU) against the fictional sample documents and
# publishes the accuracy report. Slow (about half an hour), so it runs on demand and weekly.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  eval:
    name: Evaluate with qwen3:8b and bge-m3
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install Ollama and pull the models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -s localhost:11434 > /dev/null && break; sleep 2; done
          ollama pull qwen3:8b
          ollama pull bge-m3
      - name: Run the evaluation
        working-directory: backend
        run: ./mvnw -B test -Peval -Dtest=AccuracyEvaluationTest
      - name: Publish the report
        if: always()
        run: |
          if [ -f backend/target/eval-report.md ]; then
            cat backend/target/eval-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was written; see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: backend/target/eval-report.md
          if-no-files-found: ignore
