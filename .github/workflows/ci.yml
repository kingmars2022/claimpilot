name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install Tesseract (OCR tests)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Run tests with Testcontainers (pgvector, MongoDB, Kafka, Redis, RustFS)
        working-directory: backend
        run: ./mvnw -B test
      - name: Test report
        if: always()
        run: |
          echo "## Backend tests" >> "$GITHUB_STEP_SUMMARY"
          cat backend/target/surefire-reports/*.txt | grep "Tests run" \
            | awk '{run+=$3; fail+=$5; err+=$7; skip+=$9} END {printf "| Run | Failed | Errors | Skipped |\n|---|---|---|---|\n| %d | %d | %d | %d |\n", run, fail, err, skip}' \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t claimpilot-backend backend
      - name: Build frontend image
        run: docker build -t claimpilot-frontend frontend
      - name: Check the frontend's security headers
        run: |
          docker run -d --name frontend -p 8088:80 --add-host backend:127.0.0.1 claimpilot-frontend
          for i in $(seq 1 20); do curl -s -o /dev/null localhost:8088 && break; sleep 1; done
          headers=$(curl -sI localhost:8088)
          echo "$headers"
          for h in Content-Security-Policy X-Content-Type-Options X-Frame-Options Referrer-Policy; do
            echo "$headers" | grep -qi "^$h:" || { echo "Missing header $h"; exit 1; }
          done
