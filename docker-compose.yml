# Local infrastructure. Ollama runs natively on macOS (not in Docker) so it can use the Apple GPU.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: claimpilot-postgres
    environment:
      POSTGRES_DB: claimpilot
      POSTGRES_USER: claimpilot
      POSTGRES_PASSWORD: claimpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimpilot -d claimpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Conversation history (phase 2)
  mongo:
    image: mongo:7.0
    container_name: claimpilot-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Added in later phases (started with --profile when needed):
  # redis    (phase 5, profile "cache")
  # kafka    (phase 3, profile "events")

volumes:
  pgdata:
  mongodata:
