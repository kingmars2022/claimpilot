spring:
  application:
    name: claimpilot
  threads:
    virtual:
      enabled: true          # @Async indexing jobs run on virtual threads
  datasource:
    url: jdbc:postgresql://localhost:5432/claimpilot
    username: claimpilot
    password: claimpilot
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none         # schema is owned by Flyway
  mongodb:
    uri: mongodb://localhost:27017/claimpilot
    representation:
      uuid: standard         # store java.util.UUID as the standard BSON binary subtype
  data:
    mongodb:
      auto-index-creation: true
      uuid-representation: standard
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest   # a worker that starts late still processes waiting uploads
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    retry:
      max-attempts: 3        # fail in seconds, not minutes, when the model is not running
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
    model:
      chat: ollama           # ollama locally; bedrock-converse with the "aws" profile
      embedding: ollama      # ollama locally; bedrock-titan with the "aws" profile
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3:8b
        temperature: 0.2
        think: false         # answer directly, no reasoning trace
      embedding:
        model: bge-m3        # 1024-dim embeddings; also multilingual if other languages are added later
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024     # bge-m3 output size
        index-type: HNSW
        distance-type: COSINE_DISTANCE

claimpilot:
  storage:
    type: local              # local | s3 (RustFS locally, Amazon S3 in the cloud)
    local-root: ./data/uploads
    # AES-256 key (base64, 32 bytes) for encrypting uploads at rest. Development default only:
    # set CLAIMPILOT_STORAGE_ENCRYPTION_KEY anywhere else (openssl rand -base64 32).
    encryption-key: ${CLAIMPILOT_STORAGE_ENCRYPTION_KEY:ZGV2LW9ubHktZmlsZS1rZXktY2hhbmdlLW1lLTAxMjM=}
    s3:
      endpoint: http://localhost:9000   # RustFS; leave empty for Amazon S3
      region: ca-central-1
      bucket: claimpilot-uploads
      access-key: ${CLAIMPILOT_S3_ACCESS_KEY:claimpilot}
      secret-key: ${CLAIMPILOT_S3_SECRET_KEY:claimpilot-secret}
      path-style: true
  events:
    mode: inline             # inline | kafka (docker compose --profile events, then the "events" Spring profile)
    uploaded-topic: claimpilot.documents.uploaded
    processed-topic: claimpilot.documents.processed
  cache:
    type: memory             # memory | redis (docker compose --profile cache, then the "cache" Spring profile)
    ttl: 24h                 # a model reply is reused for the same prompt and user for this long
    model-requests-per-minute: 20
  indexing:
    chunk-size: 300          # tokens per chunk; Markdown is first split at headings
  retrieval:
    top-k: 5
    similarity-threshold: 0.40
  conversation:
    history-turns: 3         # earlier question/answer pairs sent as context with a follow-up
  ocr:
    command: tesseract       # macOS: brew install tesseract (and tesseract-lang for French)
    languages: eng
  security:
    # Development default only. Set CLAIMPILOT_SECURITY_JWT_SECRET (32+ characters) anywhere else.
    jwt-secret: ${CLAIMPILOT_SECURITY_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    token-ttl: 8h

logging:
  level:
    org.apache.kafka: warn   # Kafka clients print their whole configuration at info level

management:
  health:
    redis:
      enabled: false         # Redis is optional; the "cache" profile turns its health check on
  endpoints:
    web:
      exposure:
        include: health,info
